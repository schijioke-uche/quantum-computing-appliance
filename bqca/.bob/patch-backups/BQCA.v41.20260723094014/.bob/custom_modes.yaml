      # BQCA-QISKIT-HOME-ENV-v40:END
      # BQCA-RESULT-OUTPUT-v42:BEGIN
      V42 STRICT RESULT OUTPUT POLICY: Preserve all v38-v41 account, Qiskit 2.5+, $HOME/qiskit-v2x-env, Open/Paid plan, simulator fallback, backend.run, notebook, and request-scoped Hello World rules. For every quantum/Qiskit .py or .ipynb execution, use qiskit-v2x-environment.sh run or run-notebook so qiskit-result-output.sh creates <source-stem>-result-output.txt in the same directory. Capture complete combined stdout/stderr, including Qiskit Connector, plan, backend, QPU, simulator, fallback, warning, error, and result printout. Generated code must print BQCA_EXECUTION_TARGET=REAL_QPU or SIMULATOR, BQCA_PLAN, BQCA_BACKEND, BQCA_RESULT, and BQCA_JOB_ID after successful real-QPU result retrieval. For REAL_QPU the JOB ID must be the first line of the report. The bottom must contain the professionally formatted RESULT SUMMARY with execution success. Designs state this contract textually; code, design, and report must pass v42 validation before completion.
      # BQCA-RESULT-OUTPUT-v42:END
      # BQCA-HELLO-WORLD-SCOPE-v41:BEGIN
      V41 STRICT REQUEST-SCOPED HELLO WORLD POLICY: Preserve all v38-v40 configuration, Qiskit 2.5+, home-environment, Open Plan, Paid Plan, simulator fallback, and backend.run restrictions. Hello World is not a universal design or code test. For every non-Hello-World request, do not add, mention, scaffold, execute, validate, document, or require a Hello World section, test, command, artifact, filename, example, or bob-quantum-store/test reference. Only when the user explicitly requests a Hello World design or executable may BQCA use the request-scoped shortcut and existing artifacts under bob-quantum-store/test. Explicit Hello World artifacts must be named or titled as Hello World. All generated designs and code must pass the v41 scope validator.
      # BQCA-HELLO-WORLD-SCOPE-v41:END
      # BQCA-QISKIT-CONFIGURATION-v38:BEGIN
      V38 QISKIT CONFIGURATION GATE: Treat create, implement, write, generate, build, develop, produce, scaffold, construct, code, program, modify, update, repair, fix, refactor, complete, or execute as code-producing when the object is a quantum/Qiskit workload or artifact. Before invoking qiskit_connector rules, templates, validators, generated Connector code, or backend selection, run .bob/quantum-tools/qiskit-configuration.sh configure --quiet and stop on failure. The generated ~/.qiskit/qiskit-ibm.json must contain exactly one profile named bqca, and bqca must be the only default account. Never print IQP_API_TOKEN.
      # BQCA-QISKIT-CONFIGURATION-v38:END
