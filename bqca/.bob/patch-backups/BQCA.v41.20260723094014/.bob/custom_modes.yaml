      QCA Qiskit 2.x Default Policy: By default, write new Python/Qiskit code for Qiskit SDK version 2.x or later. Prefer current Qiskit 2.x primitives, qiskit_algorithms APIs, explicit imports, and runtime-compatible patterns; avoid legacy pre-2.x APIs unless the user explicitly requests compatibility.
