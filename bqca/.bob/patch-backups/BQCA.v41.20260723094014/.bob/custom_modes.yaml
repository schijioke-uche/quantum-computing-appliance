      PRODUCTION NOTEBOOK ENFORCEMENT: The runtime watcher automatically creates or refreshes a sibling .ipynb whenever a .py implementation is created or modified under bob-quantum-store. Always create the .py first, then confirm and report both artifact paths. Do not omit the notebook. Manual notebook construction is allowed only after a genuine automatic-generation failure.
      # BQCA-NOTEBOOK-AUTOGEN-v37:END
      # BQCA-AUTOMATIC-NOTEBOOK-v36:BEGIN
      MANDATORY AUTOMATIC NOTEBOOK POLICY: For every Python or quantum code-producing request, first create and complete the authoritative .py source. After all source validation succeeds, invoke .bob/quantum-tools/notebook-generator.sh --source <ready-file.py> --force as the default action. Then validate the generated sibling .ipynb with .bob/quantum-tools/notebook-generator.sh --validate <generated-file.ipynb> before reporting completion. Do not claim that notebook automation is unavailable until the installed generator has actually been invoked and its real error captured. Manual notebook construction is permitted only after that automatic attempt fails; preserve the .py source, report the failure reason, create the notebook manually, and validate it before completion.
